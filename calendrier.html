<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17242D">
<meta name="robots" content="noindex, nofollow">
<title>PGV · Calendrier — Sigma</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iI0MwNjIyRCIvPjx0ZXh0IHg9IjE2IiB5PSIyNCIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlM8L3RleHQ+PC9zdmc+" type="image/svg+xml">
<link rel="stylesheet" href="css/ops.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar"></aside>
  <main class="main">
    <header class="topbar"></header>
    <div class="content">
      <div id="ops-banner" class="p-banner" hidden></div>

      <div class="welcome-row">
        <div>
          <span class="welcome-kicker">PGV · Vue d’ensemble</span>
          <h1>Calendrier</h1>
          <p>Calibrages et documentation de suivi, réunis sur un même mois.</p>
        </div>
        <div class="welcome-right">
          <span class="tag" id="month-counts">—</span>
        </div>
      </div>

      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn-sm" id="btn-prev" aria-label="Mois précédent">‹</button>
          <strong id="month-label">—</strong>
          <button class="btn-sm" id="btn-next" aria-label="Mois suivant">›</button>
          <button class="btn-sm" id="btn-today">Aujourd’hui</button>
        </div>
        <div class="cal-filters">
          <select class="f-select" id="filter-category" aria-label="Afficher">
            <option value="all">Calibrages + suivis</option>
            <option value="cal">Calibrages seulement</option>
            <option value="doc">Documents de suivi seulement</option>
          </select>
          <select class="f-select" id="filter-agent" aria-label="Agent"><option value="all">Tous les agents</option></select>
          <input type="search" id="search" placeholder="Agent, objet, n° d’appel…" aria-label="Rechercher">
        </div>
      </div>

      <div class="panel">
        <div class="panel-body">
          <div class="cal-month" id="cal-head"></div>
          <div class="cal-month" id="cal"></div>
          <div class="cal-legend">
            <span><i class="lg-cal"></i>Calibrage</span>
            <span><i class="lg-rencontre"></i>Rencontre</span>
            <span><i class="lg-feedback"></i>Feedback</span>
            <span><i class="lg-observation"></i>Observation</span>
            <span><i class="lg-rapport"></i>Rapport de fait</span>
            <span><i class="lg-disc"></i>Disciplinaire</span>
            <span><i class="lg-status-plan"></i>En pointillés : jamais ouvert</span>
          </div>
        </div>
      </div>


    </div>
  </main>
</div>

<div id="event-modal" class="ops-modal" role="dialog" aria-modal="true" aria-labelledby="event-title" hidden>
  <div class="ops-modal-card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
      <h2 id="event-title" style="margin:0;font:600 19px var(--serif)">Détail</h2>
      <button type="button" class="btn-sm" id="event-close">Fermer</button>
    </div>
    <div id="event-actions" hidden style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px"></div>
    <div id="event-body"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script>window.__SIGMA_PAGE = 'calendrier';</script>
<script>window.__SIGMA_ACTIVITY = 'pgv';</script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="scripts/app-shared.js"></script>
<script src="js/pgv-grid.js"></script>
<script src="js/pgv-data.js"></script>
<script src="js/ops-common.js"></script>
<script>
(async function () {
  'use strict';
  var $ = OPS.$, $$ = OPS.$$, esc = OPS.esc;
  var session = await OPS.boot({ active: 'calendrier', title: 'Calendrier' });
  if (!session) return;
  var isManager = session.isManager, profile = session.profile;

  var AGENTS = [], agentById = {}, ELEMENTS = [], elementById = {}, elementByCode = {};
  var CAL = [], DOCS = [], CURRENT_EVENT = null;
  var today = pgvData.iso();
  var MONTH = today.slice(0, 7);           // YYYY-MM
  var SELECTED = null;

  try {
    await pgvData.init();
    AGENTS = await pgvData.loadAgents();
    try { ELEMENTS = await pgvData.loadElements(); } catch (e) { ELEMENTS = []; }
    ELEMENTS.forEach(function (x) { elementById[x.id] = x; elementByCode[x.code] = x; });
  } catch (e) {
    OPS.banner('Chargement impossible', esc(e.message), 'error');
    return;
  }

  AGENTS.forEach(function (a) {
    agentById[a.id] = a;
    var o = document.createElement('option');
    o.value = a.id; o.textContent = a.full_name;
    $('#filter-agent').appendChild(o);
  });
  function name(id) { return agentById[id] ? agentById[id].full_name : 'Agent inconnu'; }

  function monthBounds(ym) {
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7);
    return {
      from: ym + '-01',
      to: ym + '-' + String(new Date(y, m, 0).getDate()).padStart(2, '0')
    };
  }

  /* ---------------- chargement ---------------- */
  async function load() {
    var b = monthBounds(MONTH);
    try {
      CAL = await pgvData.loadCalibrationsFull(b.from, b.to);
      DOCS = await pgvData.loadDocuments(b.from, b.to);
      if (!isManager) {
        CAL = CAL.filter(function (c) { return c.agent_id === profile.agentId; });
        DOCS = DOCS.filter(function (d) { return d.agent_id === profile.agentId; });
      }
    } catch (e) {
      OPS.banner('Lecture impossible', esc(e.message), 'error');
      CAL = []; DOCS = [];
    }
    render();
  }

  /* ---------------- modèle d'événements ---------------- */
  function allEvents() {
    var ev = [];
    CAL.forEach(function (c) {
      ev.push({
        kind: 'cal', id: c.id, date: c.calibration_date, agentId: c.agent_id,
        status: c.status, callId: c.call_id, record: c
      });
    });
    DOCS.forEach(function (d) {
      ev.push({
        kind: 'doc', id: d.id, date: d.meeting_date, agentId: d.agent_id,
        status: d.status, type: d.doc_type, object: d.object, record: d
      });
    });
    return ev;
  }

  function passesFilters(e) {
    var cat = $('#filter-category').value;
    var ag = $('#filter-agent').value;
    var q = $('#search').value.trim().toLowerCase();
    if (cat === 'cal' && e.kind !== 'cal') return false;
    if (cat === 'doc' && e.kind !== 'doc') return false;
    if (ag !== 'all' && e.agentId !== ag) return false;
    if (q) {
      var hay = [name(e.agentId)].join(' ').toLowerCase();
      if (e.callId) hay += ' ' + String(e.callId).toLowerCase();
      if (e.object) hay += ' ' + String(e.object).toLowerCase();
      if (e.type) hay += ' ' + String(e.type).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  /* ---------------- rendu ---------------- */
  function render() {
    var b = monthBounds(MONTH);
    var y = +MONTH.slice(0, 4), m = +MONTH.slice(5, 7) - 1;
    $('#month-label').textContent = new Date(y, m, 1)
      .toLocaleDateString('fr-MA', { month: 'long', year: 'numeric' });

    var ev = allEvents().filter(passesFilters);
    var byDate = {};
    ev.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });

    var nCal = ev.filter(function (e) { return e.kind === 'cal'; }).length;
    var nDoc = ev.filter(function (e) { return e.kind === 'doc'; }).length;
    $('#month-counts').textContent = nCal + ' calibrage(s) · ' + nDoc + ' document(s)';

    $('#cal-head').innerHTML = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim']
      .map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var cells = [];
    for (var i = 0; i < offset; i++) cells.push('<div class="cal-cell muted"></div>');

    for (var day = 1; day <= daysInMonth; day++) {
      var iso = MONTH + '-' + String(day).padStart(2, '0');
      var wd = new Date(y, m, day).getDay();
      var list = byDate[iso] || [];
      var cls = 'cal-cell' + (iso === today ? ' today' : '') + ((wd === 0 || wd === 6) ? ' is-weekend' : '');
      var chips = list.slice(0, 3).map(function (e) {
        if (e.kind === 'cal') {
          return '<button type="button" class="cal-chip cal" data-event-kind="cal" data-event-id="' + esc(e.id) + '" title="Ouvrir le calibrage · ' + esc(name(e.agentId)) + '">' +
            esc(name(e.agentId).split(' ')[0]) + ' · calibrage</button>';
        }
        return '<button type="button" class="cal-chip ' + ('doc-' + slug(e.type)) + '" data-event-kind="doc" data-event-id="' + esc(e.id) + '" title="Ouvrir ' + esc(e.type + ' · ' + name(e.agentId)) + '">' +
          esc(name(e.agentId).split(' ')[0]) + ' · ' + esc(e.type) + '</button>';
      }).join('');
      if (list.length > 3) chips += '<span class="cal-more">+' + (list.length - 3) + '</span>';
      cells.push('<div class="' + cls + '" data-date="' + iso + '">' +
        '<div class="cal-daynum"><span>' + day + '</span>' +
          (list.length ? '<span>' + list.length + '</span>' : '') + '</div>' + chips + '</div>');
    }
    $('#cal').innerHTML = cells.join('');

    $$('#cal [data-event-id]').forEach(function (chip) {
      chip.addEventListener('click', function (e) {
        e.stopPropagation();
        var kind = chip.getAttribute('data-event-kind'), id = chip.getAttribute('data-event-id');
        var record = (kind === 'cal' ? CAL : DOCS).filter(function (x) { return x.id === id; })[0];
        if (!record) return;
        SELECTED = kind === 'cal' ? record.calibration_date : record.meeting_date;
        renderDay([{ kind: kind, record: record }]);
      });
    });
  }

  function slug(t) {
    return { 'Rencontre': 'rencontre', 'Feedback': 'feedback', 'Observation': 'observation',
             'Rapport de fait': 'rapport', 'Disciplinaire': 'disc' }[t] || 'rencontre';
  }

  function renderDay(list) {
    $('#event-title').textContent = (list.length ? (list[0].kind === 'cal' ? 'Calibrage' : list[0].record.doc_type) : 'Événements') + ' · ' + OPS.fmtDateLong(SELECTED);
    if (!list.length) {
      CURRENT_EVENT = null;
      $('#event-body').innerHTML = '<p class="empty-note">Rien ce jour-là.</p>';
      $('#event-actions').hidden = true;
      return;
    }
    list.sort(function (a, b) { return (a.kind === 'cal' ? 0 : 1) - (b.kind === 'cal' ? 0 : 1); });
    CURRENT_EVENT = list[0];
    var actions = $('#event-actions');
    actions.innerHTML = '';
    if (isManager) {
      actions.innerHTML = '<button type="button" class="btn-sm" id="event-edit">Modifier</button>' +
        '<button type="button" class="btn-sm danger" id="event-delete">Supprimer</button>';
      actions.hidden = false;
      $('#event-edit').addEventListener('click', editCurrentEvent);
      $('#event-delete').addEventListener('click', deleteCurrentEvent);
    } else actions.hidden = true;

    if (CURRENT_EVENT.kind === 'cal') {
      var c = CURRENT_EVENT.record;
      var resultMap = {};
      (c.calibration_results || []).forEach(function (r) { resultMap[r.element_id] = r; });
      var vals = window.PGV_GRID.map(function (g) {
        var el = elementByCode[g.code], r = el && resultMap[el.id];
        return r ? r.result : 'N/A';
      });
      var score = window.pgvScore ? window.pgvScore(vals) : null;
      var noCount = vals.filter(function (v) { return v === 'Non'; }).length;
      var html = '<div class="cal-dayitem"><header><span class="doc-tag doc-rencontre" style="background:#FDF2EC;color:#A34D22">Calibrage</span>' +
        '<span class="p-pill ' + (c.status === 'Terminé' ? 'ok' : 'warn') + '">' + esc(c.status || '—') + '</span></header>' +
        '<div class="detail-grid">' +
          '<div><small>Agent</small><strong>' + esc(name(c.agent_id)) + '</strong></div>' +
          '<div><small>ID d’appel</small><strong>' + esc(c.call_id || '—') + '</strong></div>' +
          '<div><small>Date de l’appel</small><strong>' + OPS.fmtDate(c.call_date) + '</strong></div>' +
          '<div><small>Date du calibrage</small><strong>' + OPS.fmtDate(c.calibration_date) + '</strong></div>' +
          '<div><small>Évaluateur</small><strong>' + esc(c.evaluator_name || '—') + '</strong></div>' +
          '<div><small>Score pondéré</small><strong>' + (score && score.complet ? score.pct + ' %' : 'Incomplet') + '</strong></div>' +
          '<div><small>Points en écart</small><strong>' + noCount + '</strong></div>' +
          '<div><small>Canal</small><strong>' + esc(c.channel || 'Appel') + '</strong></div>' +
        '</div>' +
        '<h3 style="margin:14px 0 8px">Détail des critères</h3><div class="detail-fiss">';
      window.PGV_GRID.forEach(function (g) {
        var el = elementByCode[g.code], r = el && resultMap[el.id];
        html += '<div><small>' + esc(g.code) + ' · ' + esc(g.label) + ' · ' + esc(g.cat) + '</small><p><b>' +
          esc(r ? r.result : 'N/A') + '</b>' + (r && r.reason ? ' — ' + esc(r.reason) : '') + '</p></div>';
      });
      html += '</div>' + (c.notes ? '<div class="detail-item" style="margin-top:10px"><small>Notes</small><p>' + esc(c.notes) + '</p></div>' : '') +
        '<p style="margin-top:12px"><a href="pgv-calibrages.html">Ouvrir l’historique des calibrages</a></p></div>';
      $('#event-body').innerHTML = html;
    } else {
      var d = CURRENT_EVENT.record;
      $('#event-body').innerHTML = '<article class="cal-dayitem"><header><span class="doc-tag doc-' + slug(d.doc_type) + '">' + esc(d.doc_type) + '</span>' +
        '<span class="p-pill ' + (d.status === 'Terminé' ? 'ok' : d.status === 'Annulé' ? 'grey' : 'warn') + '">' + esc(d.status || '—') + '</span></header>' +
        '<div class="detail-grid">' +
          '<div><small>Agent</small><strong>' + esc(name(d.agent_id)) + '</strong></div>' +
          '<div><small>Objet</small><strong>' + esc(d.object || '—') + '</strong></div>' +
          '<div><small>Date de rencontre</small><strong>' + OPS.fmtDate(d.meeting_date) + '</strong></div>' +
          '<div><small>Date de suivi</small><strong>' + (d.follow_up_date ? OPS.fmtDate(d.follow_up_date) : '—') + '</strong></div>' +
          '<div><small>ID d’appel</small><strong>' + esc(d.call_id || '—') + '</strong></div>' +
          '<div><small>Visibilité</small><strong>' + (d.visibility === 'agent' ? 'Superviseur + agent' : 'Superviseur seulement') + '</strong></div>' +
        '</div><div class="detail-fiss">' +
          '<div><small>Faits</small><p>' + esc(d.facts || '—') + '</p></div>' +
          '<div><small>Impacts</small><p>' + esc(d.impacts || '—') + '</p></div>' +
          '<div><small>Solutions</small><p>' + esc(d.solutions || '—') + '</p></div>' +
          '<div><small>Suivi</small><p>' + esc(d.followup || '—') + '</p></div>' +
        '</div><p style="margin-top:12px"><a href="documents.html?activity=pgv">Ouvrir dans la documentation</a></p></article>';
    }
    $('#event-modal').hidden = false;
    document.body.classList.add('modal-open');
  }

  function editCurrentEvent() {
    if (!CURRENT_EVENT || !isManager) return;
    var e = CURRENT_EVENT, r = e.record;
    $('#event-actions').innerHTML = '<button type="button" class="btn-sm" id="event-edit-cancel">Annuler</button>' +
      '<button type="button" class="btn-sm primary" id="event-edit-save">Enregistrer</button>';
    $('#event-edit-cancel').addEventListener('click', function () { renderDay([CURRENT_EVENT]); });
    if (e.kind === 'doc') {
      var types = ['Rencontre','Feedback','Observation','Rapport de fait','Disciplinaire'];
      var agentsHtml = AGENTS.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === r.agent_id ? ' selected' : '') + '>' + esc(a.full_name) + '</option>'; }).join('');
      $('#event-body').innerHTML = '<div class="f-row c2">' +
        '<div><label class="f-label">Type</label><select id="ed-type" class="f-select">' + types.map(function (t) { return '<option' + (t === r.doc_type ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="f-label">Objet</label><input id="ed-object" class="f-input" value="' + esc(r.object || '') + '"></div>' +
        '<div><label class="f-label">Agent PGV</label><select id="ed-agent" class="f-select">' + agentsHtml + '</select></div>' +
        '<div><label class="f-label">Statut</label><select id="ed-status" class="f-select">' + ['Planifié','Terminé','Annulé'].map(function (x) { return '<option' + (x === r.status ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="f-label">Date de rencontre</label><input type="date" id="ed-meeting" class="f-input" value="' + esc(r.meeting_date || '') + '"></div>' +
        '<div><label class="f-label">Date de suivi</label><input type="date" id="ed-follow" class="f-input" value="' + esc(r.follow_up_date || '') + '"></div>' +
        '<div><label class="f-label">ID d’appel</label><input id="ed-call" class="f-input" value="' + esc(r.call_id || '') + '"></div>' +
        '<div><label class="f-label">Visibilité</label><select id="ed-visibility" class="f-select"><option value="supervisor"' + (r.visibility !== 'agent' ? ' selected' : '') + '>Superviseur seulement</option><option value="agent"' + (r.visibility === 'agent' ? ' selected' : '') + '>Superviseur + agent</option></select></div>' +
        '</div><div class="f-row"><label class="f-label">Faits</label><textarea id="ed-facts" class="f-input" rows="3">' + esc(r.facts || '') + '</textarea>' +
        '<label class="f-label">Impacts</label><textarea id="ed-impacts" class="f-input" rows="3">' + esc(r.impacts || '') + '</textarea>' +
        '<label class="f-label">Solutions</label><textarea id="ed-solutions" class="f-input" rows="3">' + esc(r.solutions || '') + '</textarea>' +
        '<label class="f-label">Suivi</label><textarea id="ed-followup" class="f-input" rows="3">' + esc(r.followup || '') + '</textarea></div>';
      $('#event-edit-save').addEventListener('click', async function () {
        var b = this; b.disabled = true;
        try {
          await pgvData.saveDocument({ id:r.id, type:$('#ed-type').value, object:$('#ed-object').value.trim(),
            agentId:$('#ed-agent').value, status:$('#ed-status').value, meetingDate:$('#ed-meeting').value,
            followUpDate:$('#ed-follow').value || null, callId:$('#ed-call').value.trim() || null,
            visibility:$('#ed-visibility').value, facts:$('#ed-facts').value.trim(), impacts:$('#ed-impacts').value.trim(),
            solutions:$('#ed-solutions').value.trim(), followup:$('#ed-followup').value.trim() });
          OPS.toast('Document mis à jour'); await load();
          var fresh = DOCS.filter(function (x) { return x.id === r.id; })[0];
          if (fresh) { CURRENT_EVENT = { kind:'doc', id:fresh.id, date:fresh.meeting_date, agentId:fresh.agent_id, record:fresh }; renderDay([CURRENT_EVENT]); }
          else closeEvent();
        } catch (err) { OPS.toast(err.message || 'Modification refusée', 'error'); }
        finally { b.disabled = false; }
      });
    } else {
      var resultMap = {};
      (r.calibration_results || []).forEach(function (x) { resultMap[x.element_id] = x; });
      var agentOpts = AGENTS.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === r.agent_id ? ' selected' : '') + '>' + esc(a.full_name) + '</option>'; }).join('');
      var form = '<div class="f-row c2">' +
        '<div><label class="f-label">Agent PGV</label><select id="ec-agent" class="f-select">' + agentOpts + '</select></div>' +
        '<div><label class="f-label">Statut</label><select id="ec-status" class="f-select">' + ['Planifié','Terminé'].map(function (x) { return '<option' + (x === r.status ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="f-label">Date de l’appel</label><input type="date" id="ec-call-date" class="f-input" value="' + esc(r.call_date || '') + '"></div>' +
        '<div><label class="f-label">Date du calibrage</label><input type="date" id="ec-date" class="f-input" value="' + esc(r.calibration_date || '') + '"></div>' +
        '<div><label class="f-label">ID d’appel</label><input id="ec-call" class="f-input" value="' + esc(r.call_id || '') + '"></div>' +
        '<div><label class="f-label">Évaluateur</label><input id="ec-evaluator" class="f-input" value="' + esc(r.evaluator_name || '') + '"></div>' +
        '</div><div class="f-row"><label class="f-label">Notes</label><textarea id="ec-notes" class="f-input" rows="2">' + esc(r.notes || '') + '</textarea></div>';
      form += '<div class="cal-daylist">';
      window.PGV_GRID.forEach(function (g, i) {
        var el = elementByCode[g.code], old = el && resultMap[el.id];
        var val = old ? old.result : 'N/A';
        form += '<div class="cal-dayitem"><b>' + esc(g.code) + ' · ' + esc(g.label) + '</b>' +
          '<div class="f-row c2"><select class="f-select" data-cal-result="' + i + '">' + ['Oui','Non','N/A'].map(function (x) { return '<option' + (x === val ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select>' +
          '<input class="f-input" data-cal-reason="' + i + '" placeholder="Motif si Non" value="' + esc(old ? old.reason || '' : '') + '"></div></div>';
      });
      form += '</div>';
      $('#event-body').innerHTML = form;
      $('#event-edit-save').addEventListener('click', async function () {
        if (ELEMENTS.length < window.PGV_GRID.length) { OPS.toast('Grille indisponible; impossible de modifier les réponses.', 'error'); return; }
        var b = this; b.disabled = true;
        try {
          var vals = window.PGV_GRID.map(function (_, i) { return $('[data-cal-result="' + i + '"]').value; });
          var reasons = window.PGV_GRID.map(function (_, i) { return $('[data-cal-reason="' + i + '"]').value.trim(); });
          var missing = vals.findIndex(function (v, i) { return v === 'Non' && !reasons[i]; });
          if (missing >= 0) throw new Error('Motif requis pour ' + window.PGV_GRID[missing].code + '.');
          var elements = window.PGV_GRID.map(function (g) { return elementByCode[g.code]; });
          if (elements.some(function (x) { return !x; })) throw new Error('La grille PGV n’est pas complète en base.');
          await pgvData.updateCalibration(r.id, { agentId:$('#ec-agent').value, status:$('#ec-status').value,
            callDate:$('#ec-call-date').value, date:$('#ec-date').value, callId:$('#ec-call').value.trim(),
            evaluator:$('#ec-evaluator').value.trim(), evaluator_kind:r.evaluator || 'Autre', language:r.language || 'Français',
            notes:$('#ec-notes').value.trim(), values:vals, reasons:reasons, elements:elements });
          OPS.toast('Calibrage mis à jour'); await load();
          var fresh = CAL.filter(function (x) { return x.id === r.id; })[0];
          if (fresh) { CURRENT_EVENT = { kind:'cal', id:fresh.id, date:fresh.calibration_date, agentId:fresh.agent_id, record:fresh }; renderDay([CURRENT_EVENT]); }
          else closeEvent();
        } catch (err) { OPS.toast(err.message || 'Modification refusée', 'error'); }
        finally { b.disabled = false; }
      });
    }
  }

  async function deleteCurrentEvent() {
    if (!CURRENT_EVENT || !isManager) return;
    var e = CURRENT_EVENT;
    if (!confirm('Supprimer définitivement ' + (e.kind === 'cal' ? 'ce calibrage ?' : 'ce document ?'))) return;
    try {
      if (e.kind === 'cal') await pgvData.deleteCalibration(e.id);
      else await pgvData.deleteDocument(e.id);
      OPS.toast('Élément supprimé'); closeEvent(); await load();
    } catch (err) { OPS.toast(err.message || 'Suppression refusée', 'error'); }
  }

  function closeEvent() { $('#event-modal').hidden = true; document.body.classList.remove('modal-open'); }
  $('#event-close').addEventListener('click', closeEvent);
  $('#event-modal').addEventListener('click', function (e) { if (e.target === $('#event-modal')) closeEvent(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#event-modal').hidden) closeEvent(); });

  /* ---------------- navigation ---------------- */
  function shiftMonth(n) {
    var y = +MONTH.slice(0, 4), m = +MONTH.slice(5, 7) - 1 + n;
    var d = new Date(y, m, 1);
    MONTH = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    SELECTED = null;
    load();
  }
  $('#btn-prev').addEventListener('click', function () { shiftMonth(-1); });
  $('#btn-next').addEventListener('click', function () { shiftMonth(1); });
  $('#btn-today').addEventListener('click', function () {
    MONTH = today.slice(0, 7); SELECTED = null; load();
  });
  ['#filter-category', '#filter-agent'].forEach(function (s) {
    $(s).addEventListener('change', render);
  });
  $('#search').addEventListener('input', (function () {
    var t = null;
    return function () { clearTimeout(t); t = setTimeout(render, 220); };
  })());

  await load();
})();
</script>
<script src="js/support-widget.js" defer></script>
</body>
</html>
