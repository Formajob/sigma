<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17242D">
<meta name="robots" content="noindex, nofollow">
<title>PGV · Calendrier — Sigma</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iI0MwNjIyRCIvPjx0ZXh0IHg9IjE2IiB5PSIyNCIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlM8L3RleHQ+PC9zdmc+" type="image/svg+xml">
<link rel="stylesheet" href="css/ops.css">
<link rel="stylesheet" href="css/polish.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar"></aside>
  <main class="main">
    <header class="topbar"></header>
    <div class="content calendar-content">
      <div id="ops-banner" class="p-banner" hidden></div>

      <div class="welcome-row">
        <div>
          <span class="welcome-kicker">PGV · Vue d’ensemble</span>
          <h1>Calendrier</h1>
          <p>Calibrages et documentation de suivi, réunis sur un même mois.</p>
        </div>
        <div class="welcome-right">
          <button class="button button-muted" id="new-calibration" hidden>＋ Calibrage</button>
          <button class="button button-muted" id="new-document" hidden>＋ Documentation</button>
          <span class="tag" id="calendar-live-status" aria-live="polite">Connexion…</span>
          <span class="tag" id="month-counts">—</span>
        </div>
      </div>

      <div class="cal-toolbar">
        <div class="cal-nav">
          <button class="btn-sm" id="btn-prev" aria-label="Mois précédent">‹</button>
          <strong id="month-label">—</strong>
          <button class="btn-sm" id="btn-next" aria-label="Mois suivant">›</button>
          <button class="btn-sm" id="btn-today">Aujourd’hui</button>
        </div>
        <div class="cal-filters">
          <select class="f-select" id="filter-agent" aria-label="Agent"><option value="all">Tous les agents</option></select>
          <input type="search" id="search" placeholder="Agent, objet, n° d’appel…" aria-label="Rechercher">
        </div>
      </div>

      <p id="agent-calendar-note" class="f-note" hidden>Les calibrages de toute l’équipe sont visibles ici, avec les notes, réponses et motifs détaillés. Les documents de suivi restent limités à votre propre dossier.</p>
      <div class="panel calendar-panel">
        <div class="panel-body">
          <div class="cal-legend cal-filter-bar" id="cal-legend" aria-label="Filtrer les événements par type">
            <button type="button" class="cal-filter-chip is-active" data-cal-filter="all" aria-pressed="true"><span class="filter-check">✓</span>Tout afficher</button>
            <button type="button" class="cal-filter-chip cal-filter-cal" data-cal-filter="cal"><i></i>Calibrage</button>
            <button type="button" class="cal-filter-chip cal-filter-rencontre" data-cal-filter="Rencontre"><i></i>Rencontre individuelle</button>
            <button type="button" class="cal-filter-chip cal-filter-feedback" data-cal-filter="Feedback"><i></i>Feed back</button>
            <button type="button" class="cal-filter-chip cal-filter-formation" data-cal-filter="Formation"><i></i>Formation</button>
            <button type="button" class="cal-filter-chip cal-filter-reunion" data-cal-filter="Réunion"><i></i>Réunion</button>
            <button type="button" class="cal-filter-chip cal-filter-observation" data-cal-filter="Observation"><i></i>Observation</button>
            <button type="button" class="cal-filter-chip cal-filter-disc" data-cal-filter="Disciplinaire"><i></i>Disciplinaire</button>
            <button type="button" class="cal-filter-chip cal-filter-rapport" data-cal-filter="Rapport de fait"><i></i>Rapport de fait</button>
          </div>
          <div class="cal-month" id="cal-head"></div>
          <div class="cal-month" id="cal"></div>
        </div>
      </div>


    </div>
  </main>
</div>

<div id="event-modal" class="ops-modal" role="dialog" aria-modal="true" aria-labelledby="event-title" hidden>
  <div class="ops-modal-card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px">
      <h2 id="event-title" style="margin:0;font:600 19px var(--serif)">Détail</h2>
      <button type="button" class="btn-sm" id="event-close">Fermer</button>
    </div>
    <div id="event-actions" hidden style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px"></div>
    <div id="event-body"></div>
  </div>
</div>

<script src="js/i18n.js"></script>
<script>window.__SIGMA_PAGE = 'calendrier';</script>
<script>window.__SIGMA_ACTIVITY = 'pgv';</script>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="scripts/app-shared.js"></script>
<script src="js/pgv-grid.js"></script>
<script src="js/pgv-data.js"></script>
<script src="js/ops-common.js"></script>
<script>
(async function () {
  'use strict';
  var $ = OPS.$, $$ = OPS.$$, esc = OPS.esc;
  var session = await OPS.boot({ active: 'calendrier', title: 'Calendrier' });
  if (!session) return;
  var isManager = session.isManager, profile = session.profile;
  var isPgvAgent = profile.role === 'agent' && profile.activity === 'pgv' && !!profile.agentId;
  var canCreateCalibration = isManager || isPgvAgent;

  var AGENTS = [], agentById = {}, ELEMENTS = [], elementById = {}, elementByCode = {};
  var CAL = [], DOCS = [], CURRENT_EVENT = null;
  var today = pgvData.iso();
  var MONTH = today.slice(0, 7);           // YYYY-MM
  var SELECTED = null;
  var TYPE_FILTER = 'all';

  try {
    await pgvData.init();
    AGENTS = await pgvData.loadAgents();
    try { ELEMENTS = await pgvData.loadElements(); } catch (e) { ELEMENTS = []; }
    ELEMENTS.forEach(function (x) { elementById[x.id] = x; elementByCode[x.code] = x; });
  } catch (e) {
    OPS.banner('Chargement impossible', esc(e.message), 'error');
    return;
  }

  AGENTS.forEach(function (a) {
    agentById[a.id] = a;
    var o = document.createElement('option');
    o.value = a.id; o.textContent = a.full_name;
    $('#filter-agent').appendChild(o);
  });
  function name(id) { return agentById[id] ? agentById[id].full_name : 'Agent inconnu'; }
  if (canCreateCalibration) {
    $('#new-calibration').hidden = false;
    if (isPgvAgent) $('#new-calibration').textContent = '＋ Mon calibrage';
  }
  if (isManager) $('#new-document').hidden = false;
  else {
    $('#agent-calendar-note').hidden = false;
    if (isPgvAgent) $('#agent-calendar-note').textContent = 'Les calibrages de toute l’équipe sont visibles ici. Vous pouvez créer un auto-calibrage uniquement pour vous; il sera visible par l’équipe et les responsables. Les documents de suivi restent limités à votre propre dossier.';
  }

  function monthBounds(ym) {
    // Charger les jours adjacents affichés dans la grille complète de 6 semaines.
    var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1;
    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var fromDate = new Date(y, m, 1 - offset);
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var weeks = Math.ceil((offset + daysInMonth) / 7);
    var toDate = new Date(fromDate.getFullYear(), fromDate.getMonth(), fromDate.getDate() + weeks * 7 - 1);
    function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
    return { from: isoDate(fromDate), to: isoDate(toDate) };
  }

  /* ---------------- chargement ---------------- */
  async function load() {
    var b = monthBounds(MONTH);
    try {
      CAL = await pgvData.loadCalibrationsFull(b.from, b.to);
      DOCS = await pgvData.loadDocuments(b.from, b.to);
      if (!isManager) {
        // Le périmètre des calibrages partagés est contrôlé par RLS (agents PGV).
        // Les documents de suivi restent limités aux documents destinés à cet agent.
        DOCS = DOCS.filter(function (d) { return d.agent_id === profile.agentId; });
      }
    } catch (e) {
      OPS.banner('Lecture impossible', esc(e.message), 'error');
      CAL = []; DOCS = [];
    }
    render();
  }

  /* ---------------- modèle d'événements ---------------- */
  function allEvents() {
    var ev = [];
    CAL.forEach(function (c) {
      ev.push({
        kind: 'cal', id: c.id, date: c.calibration_date, agentId: c.agent_id,
        status: c.status, callId: c.call_id, record: c
      });
    });
    DOCS.forEach(function (d) {
      ev.push({
        kind: 'doc', id: d.id, date: d.meeting_date, agentId: d.agent_id,
        status: d.status, type: d.doc_type, object: d.object, record: d
      });
    });
    return ev;
  }

  function passesFilters(e) {
    var ag = $('#filter-agent').value;
    var q = $('#search').value.trim().toLowerCase();
    if (TYPE_FILTER === 'cal' && e.kind !== 'cal') return false;
    if (TYPE_FILTER !== 'all' && TYPE_FILTER !== 'cal' && (e.kind !== 'doc' || e.type !== TYPE_FILTER)) return false;
    if (ag !== 'all' && e.agentId !== ag) return false;
    if (q) {
      var hay = [name(e.agentId)].join(' ').toLowerCase();
      if (e.callId) hay += ' ' + String(e.callId).toLowerCase();
      if (e.object) hay += ' ' + String(e.object).toLowerCase();
      if (e.type) hay += ' ' + String(e.type).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }

  /* ---------------- rendu ---------------- */
  function render() {
    var y = +MONTH.slice(0, 4), m = +MONTH.slice(5, 7) - 1;
    $('#month-label').textContent = new Date(y, m, 1)
      .toLocaleDateString('fr-MA', { month: 'long', year: 'numeric' });

    var ev = allEvents().filter(passesFilters);
    var byDate = {};
    ev.forEach(function (e) { (byDate[e.date] = byDate[e.date] || []).push(e); });

    var monthEvents = ev.filter(function (e) { return e.date && e.date.slice(0, 7) === MONTH; });
    var nCal = monthEvents.filter(function (e) { return e.kind === 'cal'; }).length;
    var nDoc = monthEvents.filter(function (e) { return e.kind === 'doc'; }).length;
    $('#month-counts').textContent = nCal + ' calibrage(s) · ' + nDoc + ' document(s)';

    $('#cal-head').innerHTML = ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim']
      .map(function (d) { return '<div class="cal-dow">' + d + '</div>'; }).join('');

    var first = new Date(y, m, 1);
    var offset = (first.getDay() + 6) % 7;
    var daysInMonth = new Date(y, m + 1, 0).getDate();
    var weeks = Math.ceil((offset + daysInMonth) / 7);
    var gridStart = new Date(y, m, 1 - offset);
    var cells = [];
    $('#cal').style.setProperty('--cal-weeks', String(weeks));
    for (var i = 0; i < weeks * 7; i++) {
      var cellDate = new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i);
      var cellYear = cellDate.getFullYear(), cellMonth = cellDate.getMonth();
      var iso = cellYear + '-' + String(cellMonth + 1).padStart(2, '0') + '-' + String(cellDate.getDate()).padStart(2, '0');
      var inMonth = cellYear === y && cellMonth === m;
      var wd = cellDate.getDay();
      var list = byDate[iso] || [];
      var cls = 'cal-cell' + (!inMonth ? ' muted' : '') + (iso === today ? ' today' : '') + ((wd === 0 || wd === 6) ? ' is-weekend' : '');
      if (list.length) cls += ' has-events';
      var chips = list.map(function (e) {
        var agentName = name(e.agentId);
        var typeName = e.kind === 'cal' ? 'Calibrage' : e.type;
        var eventStatus = String(e.status || '').toLowerCase();
        var statusIcon = /plan|attente|prévu|prevu/.test(eventStatus) ? '◷' : (/annul|cancel/.test(eventStatus) ? '×' : '✓');
        var eventClass = e.kind === 'cal' ? 'cal' : ('doc-' + slug(e.type));
        var title = typeName + ' · ' + agentName + ' · ' + (e.status || 'Terminé');
        return '<button type="button" class="cal-chip ' + eventClass + '" data-event-kind="' + e.kind + '" data-event-id="' + esc(e.id) + '" title="' + esc(title) + '" aria-label="' + esc(title) + '">' +
          '<span class="cal-chip-dot" aria-hidden="true"></span><span class="cal-chip-status" aria-hidden="true">' + statusIcon + '</span><span class="cal-chip-agent">' + esc(agentName) + '</span></button>';
      }).join('');
      cells.push('<div class="' + cls + '" data-date="' + iso + '">' +
        '<div class="cal-daynum"><span>' + cellDate.getDate() + '</span>' +
          (list.length ? '<span class="cal-daycount">' + list.length + '</span>' : '') + '</div>' +
        '<div class="cal-cell-events" aria-label="' + list.length + ' événement(s)">' + chips + '</div></div>');
    }
    $('#cal').innerHTML = cells.join('');
    requestAnimationFrame(fitCalendarToViewport);

    $$('#cal .cal-cell[data-date]').forEach(function (cell) {
      cell.addEventListener('dblclick', function () {
        if (!canCreateCalibration) return;
        SELECTED = cell.getAttribute('data-date');
        openCreateCalibration();
      });
    });

    $$('#cal [data-event-id]').forEach(function (chip) {
      chip.addEventListener('click', function (e) {
        e.stopPropagation();
        var kind = chip.getAttribute('data-event-kind'), id = chip.getAttribute('data-event-id');
        var record = (kind === 'cal' ? CAL : DOCS).filter(function (x) { return x.id === id; })[0];
        if (!record) return;
        SELECTED = kind === 'cal' ? record.calibration_date : record.meeting_date;
        renderDay([{ kind: kind, record: record }]);
      });
    });
  }

  function fitCalendarToViewport() {
    var grid = $('#cal');
    if (!grid || !grid.children.length) return;
    var rows = Math.ceil(grid.children.length / 7);
    var top = grid.getBoundingClientRect().top;
    var gap = parseFloat(getComputedStyle(grid).rowGap) || 7;
    // Priorité à la lisibilité : chaque case garde assez de hauteur pour le jour
    // et au moins trois puces de calibrage. Les événements au-delà défilent dans leur jour.
    var usable = window.innerHeight - top - 32 - gap * (rows - 1);
    var rowHeight = Math.floor(usable / rows);
    rowHeight = Math.max(112, Math.min(220, rowHeight));
    grid.style.setProperty('--cal-row-height', rowHeight + 'px');
  }
  window.addEventListener('resize', fitCalendarToViewport);

  function slug(t) {
    return { 'Rencontre': 'rencontre', 'Rencontre individuelle': 'rencontre', 'Feedback': 'feedback',
             'Formation': 'formation', 'Réunion': 'reunion', 'Reunion': 'reunion', 'Observation': 'observation',
             'Rapport de fait': 'rapport', 'Disciplinaire': 'disc' }[t] || 'rencontre';
  }

  function renderDay(list) {
    $('#event-title').textContent = (list.length ? (list[0].kind === 'cal' ? 'Calibrage' : list[0].record.doc_type) : 'Événements') + ' · ' + OPS.fmtDateLong(SELECTED);
    if (!list.length) {
      CURRENT_EVENT = null;
      $('#event-body').innerHTML = '<p class="empty-note">Rien ce jour-là.</p>';
      $('#event-actions').hidden = true;
      return;
    }
    list.sort(function (a, b) { return (a.kind === 'cal' ? 0 : 1) - (b.kind === 'cal' ? 0 : 1); });
    var selectedEvent = list[0];
    CURRENT_EVENT = Object.assign({}, selectedEvent, { id:selectedEvent.id || (selectedEvent.record && selectedEvent.record.id) });
    var actions = $('#event-actions');
    actions.innerHTML = '';
    if (isManager) {
      actions.innerHTML = (CURRENT_EVENT.kind === 'doc' && CURRENT_EVENT.record.visibility === 'agent'
        ? '<button type="button" class="btn-sm primary" id="event-send-agent">Envoyer à l’agent</button>' : '') +
        '<button type="button" class="btn-sm" id="event-edit">Modifier</button>' +
        '<button type="button" class="btn-sm danger" id="event-delete">Supprimer</button>';
      actions.hidden = false;
      $('#event-edit').addEventListener('click', editCurrentEvent);
      $('#event-delete').addEventListener('click', deleteCurrentEvent);
      var sendBtn = $('#event-send-agent');
      if (sendBtn) sendBtn.addEventListener('click', sendDocumentToAgent);
    } else actions.hidden = true;

    if (CURRENT_EVENT.kind === 'cal') {
      var c = CURRENT_EVENT.record;
      var resultMap = {};
      (c.calibration_results || []).forEach(function (r) { resultMap[r.element_id] = r; });
      var vals = window.PGV_GRID.map(function (g) {
        var el = elementByCode[g.code], r = el && resultMap[el.id];
        return r ? r.result : '';
      });
      var score = window.pgvScore ? window.pgvScore(vals) : null;
      var noCount = vals.filter(function (v) { return v === 'Non'; }).length;
      var html = '<div class="cal-dayitem"><header><span class="doc-tag doc-rencontre" style="background:#FDF2EC;color:#A34D22">Calibrage</span>' +
        '<span class="p-pill ' + (c.status === 'Terminé' ? 'ok' : 'warn') + '">' + esc(c.status || '—') + '</span></header>' +
        '<div class="detail-grid">' +
          '<div><small>Agent</small><strong>' + esc(name(c.agent_id)) + '</strong></div>' +
          '<div><small>ID d’appel</small><strong>' + esc(c.call_id || '—') + '</strong></div>' +
          '<div><small>Date de l’appel</small><strong>' + OPS.fmtDate(c.call_date) + '</strong></div>' +
          '<div><small>Date du calibrage</small><strong>' + OPS.fmtDate(c.calibration_date) + '</strong></div>' +
          '<div><small>Évaluateur</small><strong>' + esc(c.evaluator_name || '—') + '</strong></div>' +
          '<div><small>Score pondéré</small><strong>' + (score && score.complet ? score.pct + ' %' : 'Incomplet') + '</strong></div>' +
          '<div><small>Points en écart</small><strong>' + noCount + '</strong></div>' +
          '<div><small>Canal</small><strong>' + esc(c.channel || 'Appel') + '</strong></div>' +
        '</div>' +
        '<h3 style="margin:14px 0 8px">Détail des critères</h3><div class="cal-detail-families">';
      var detailTitles = { accueil:'Accueil & compréhension', traitement:'Traitement & résolution', posture:'Communication & posture' };
      ['accueil','traitement','posture'].forEach(function (cat) {
        html += '<section class="cal-detail-family"><h4>' + esc(detailTitles[cat]) + '</h4><div class="cal-detail-rows">';
        window.PGV_GRID.filter(function (g) { return g.cat === cat; }).forEach(function (g) {
          var el = elementByCode[g.code], r = el && resultMap[el.id];
          html += '<article' + (g.critical ? ' class="critical"' : '') + '><div><strong>' + esc(g.label) + (g.critical ? '<span class="cal-critical-tag">Critique</span>' : '') + '</strong><p>' + esc(g.critere) + '</p></div><div class="cal-detail-result"><b>' +
            esc(r ? r.result : '—') + '</b>' + (r && r.reason ? '<small>' + esc(r.reason) + '</small>' : '') + '</div></article>';
        });
        html += '</div></section>';
      });
      html += '</div>' + (c.notes ? '<div class="detail-item" style="margin-top:10px"><small>Notes</small><p>' + esc(c.notes) + '</p></div>' : '') +
        '';
      $('#event-body').innerHTML = html;
    } else {
      var d = CURRENT_EVENT.record;
      $('#event-body').innerHTML = '<article class="cal-dayitem"><header><span class="doc-tag doc-' + slug(d.doc_type) + '">' + esc(d.doc_type) + '</span>' +
        '<span class="p-pill ' + (d.status === 'Terminé' ? 'ok' : d.status === 'Annulé' ? 'grey' : 'warn') + '">' + esc(d.status || '—') + '</span></header>' +
        '<div class="detail-grid">' +
          '<div><small>Agent</small><strong>' + esc(name(d.agent_id)) + '</strong></div>' +
          '<div><small>Objet</small><strong>' + esc(d.object || '—') + '</strong></div>' +
          '<div><small>Date de rencontre</small><strong>' + OPS.fmtDate(d.meeting_date) + '</strong></div>' +
          '<div><small>Date de suivi</small><strong>' + (d.follow_up_date ? OPS.fmtDate(d.follow_up_date) : '—') + '</strong></div>' +
          '<div><small>ID d’appel</small><strong>' + esc(d.call_id || '—') + '</strong></div>' +
          '<div><small>Visibilité</small><strong>' + (d.visibility === 'agent' ? 'Admin + agent concerné' : 'Admin seulement') + '</strong></div>' +
        '</div><div class="detail-fiss">' +
          '<div><small>Faits</small><p>' + esc(d.facts || '—') + '</p></div>' +
          '<div><small>Impacts</small><p>' + esc(d.impacts || '—') + '</p></div>' +
          '<div><small>Solutions</small><p>' + esc(d.solutions || '—') + '</p></div>' +
          '<div><small>Suivi</small><p>' + esc(d.followup || '—') + '</p></div>' +
        '</div></article>';
    }
    $('#event-modal').hidden = false;
    document.body.classList.add('modal-open');
  }

  function editCurrentEvent() {
    if (!CURRENT_EVENT) return;
    var canCreateOwnCalibration = canCreateCalibration && CURRENT_EVENT.kind === 'cal' && !CURRENT_EVENT.record.id;
    if (!isManager && !canCreateOwnCalibration) return;
    var e = CURRENT_EVENT, r = e.record;
    $('#event-title').textContent = (r.id ? 'Modifier ' : 'Nouveau ') + (e.kind === 'cal' ? 'calibrage' : 'document de suivi');
    $('#event-modal').hidden = false;
    document.body.classList.add('modal-open');
    $('#event-actions').innerHTML = '<button type="button" class="btn-sm" id="event-edit-cancel">Annuler</button>' +
      '<button type="button" class="btn-sm primary" id="event-edit-save">Enregistrer</button>';
    $('#event-edit-cancel').addEventListener('click', closeEvent);
    if (e.kind === 'doc') {
      var types = ['Rencontre','Feedback','Observation','Rapport de fait','Disciplinaire'];
      var agentsHtml = AGENTS.map(function (a) { return '<option value="' + esc(a.id) + '"' + (a.id === r.agent_id ? ' selected' : '') + '>' + esc(a.full_name) + '</option>'; }).join('');
      $('#event-body').innerHTML = '<div class="f-row c2">' +
        '<div><label class="f-label">Type</label><select id="ed-type" class="f-select">' + types.map(function (t) { return '<option' + (t === r.doc_type ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="f-label">Objet</label><input id="ed-object" class="f-input" value="' + esc(r.object || '') + '"></div>' +
        '<div><label class="f-label">Agent PGV</label><select id="ed-agent" class="f-select">' + agentsHtml + '</select></div>' +
        '<div><label class="f-label">Statut</label><select id="ed-status" class="f-select">' + ['Planifié','Terminé','Annulé'].map(function (x) { return '<option' + (x === r.status ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></div>' +

        } catch (err) { OPS.toast(err.message || 'Modification refusée', 'error'); }
        finally { b.disabled = false; b.textContent = 'Enregistrer le calibrage'; }
      });
    }
  }

  function openCreateCalibration() {
    if (!canCreateCalibration) return;
    var date = SELECTED || today;
    var ownerAgentId = isPgvAgent ? profile.agentId : (AGENTS[0] && AGENTS[0].id);
    CURRENT_EVENT = { kind:'cal', record:{ id:null, agent_id:ownerAgentId, status:'Terminé',
      call_date:date, calibration_date:date, evaluator:'Autre', evaluator_name:isPgvAgent ? profile.displayName : '', evaluator_kind:'Autre',
      language:'Français', notes:'', calibration_results:[] } };
    editCurrentEvent();
  }
  function openCreateDocument() {
    if (!isManager) return;
    var date = SELECTED || today;
    CURRENT_EVENT = { kind:'doc', record:{ id:null, doc_type:'Rencontre', object:'', agent_id:AGENTS[0] && AGENTS[0].id,
      status:'Planifié', meeting_date:date, follow_up_date:null, call_id:'', visibility:'supervisor',
      facts:'', impacts:'', solutions:'', followup:'' } };
    editCurrentEvent();
  }
  $('#new-calibration').addEventListener('click', openCreateCalibration);
  $('#new-document').addEventListener('click', openCreateDocument);

  async function deleteCurrentEvent() {
    if (!CURRENT_EVENT || !isManager) return;
    var e = CURRENT_EVENT, id = e.id || (e.record && e.record.id);
    if (!id) { OPS.toast('Suppression impossible : identifiant manquant.', 'error'); return; }
    if (!confirm('Supprimer définitivement ' + (e.kind === 'cal' ? 'ce calibrage ?' : 'ce document ?'))) return;
    try {
      if (e.kind === 'cal') await pgvData.deleteCalibration(id);
      else await pgvData.deleteDocument(id);
      OPS.toast('Élément supprimé'); closeEvent(); await load();
    } catch (err) { OPS.toast(err.message || 'Suppression refusée', 'error'); }
  }

  async function sendDocumentToAgent() {
    if (!CURRENT_EVENT || CURRENT_EVENT.kind !== 'doc' || CURRENT_EVENT.record.visibility !== 'agent' || !isManager) return;
    var button = $('#event-send-agent');
    if (!confirm('Envoyer cette documentation à ' + name(CURRENT_EVENT.record.agent_id) + ' ?')) return;
    button.disabled = true;
    button.textContent = 'Envoi…';
    try {
      var client = await window.sigmaSupabase.getClient();
      var result = await client.functions.invoke('pgv-send-agent-document', {
        body: { document_id: CURRENT_EVENT.record.id }
      });
      if (result.error) {
        var detail = result.error.message || 'Fonction email indisponible';
        if (result.error.context && result.error.context.json) {
          var body = await result.error.context.json().catch(function () { return null; });
          if (body && body.error) detail = body.error;
        }
        throw new Error(detail);
      }
      OPS.toast('Documentation envoyée à l’agent');
      button.textContent = 'Envoyé';
    } catch (err) {
      OPS.toast(err.message || 'Envoi impossible', 'error');
      button.textContent = 'Réessayer l’envoi';
      button.disabled = false;
    }
  }

  function closeEvent() { $('#event-modal').hidden = true; document.body.classList.remove('modal-open'); }
  $('#event-close').addEventListener('click', closeEvent);
  // Pas de fermeture par clic extérieur ni par Échap : seul le bouton Fermer
  // (ou Annuler dans le formulaire d'édition) ferme explicitement la modale.

  /* ---------------- navigation ---------------- */
  function shiftMonth(n) {
    var y = +MONTH.slice(0, 4), m = +MONTH.slice(5, 7) - 1 + n;
    var d = new Date(y, m, 1);
    MONTH = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    SELECTED = null;
    load();
  }
  $('#btn-prev').addEventListener('click', function () { shiftMonth(-1); });
  $('#btn-next').addEventListener('click', function () { shiftMonth(1); });
  $('#btn-today').addEventListener('click', function () {
    MONTH = today.slice(0, 7); SELECTED = null; load();
  });
  ['#filter-agent'].forEach(function (s) {
    $(s).addEventListener('change', render);
  });
  $$('#cal-legend [data-cal-filter]').forEach(function (button) {
    button.addEventListener('click', function () {
      TYPE_FILTER = button.getAttribute('data-cal-filter') || 'all';
      $$('#cal-legend [data-cal-filter]').forEach(function (chip) {
        var active = chip === button;
        chip.classList.toggle('is-active', active);
        chip.setAttribute('aria-pressed', active ? 'true' : 'false');
      });
      render();
    });
  });
  $('#search').addEventListener('input', (function () {
    var t = null;
    return function () { clearTimeout(t); t = setTimeout(render, 220); };
  })());

  var calendarRealtime = false;
  var calendarChannel = null;
  if (session.db && typeof session.db.channel === 'function') calendarChannel = session.db.channel('pgv-calendar-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'calibrations', filter: 'activity=eq.pgv' }, function () { load(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'calibration_results' }, function () { load(); });
  if (calendarChannel) calendarChannel.subscribe(function (status) {
    calendarRealtime = status === 'SUBSCRIBED';
    var badge = $('#calendar-live-status');
    badge.textContent = calendarRealtime ? 'En direct' : 'Reconnexion…';
    badge.title = calendarRealtime ? 'Les calibrages sont synchronisés en temps réel' : 'Synchronisation Realtime en cours';
  });
  window.addEventListener('pagehide', function () { if (calendarChannel && session.db) session.db.removeChannel(calendarChannel); }, { once: true });

  await load();
  setInterval(function () { if (!calendarRealtime) load(); }, 60000);
})();
</script>
<script src="js/support-widget.js" defer></script>
</body>
</html>
