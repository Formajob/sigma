<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex, nofollow">
  <title>Marketing · Sigma</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNiIgZmlsbD0iI0MwNjIyRCIvPjx0ZXh0IHg9IjE2IiB5PSIyNCIgZm9udC1mYW1pbHk9IkFyaWFsLCBzYW5zLXNlcmlmIiBmb250LXNpemU9IjE4IiBmb250LXdlaWdodD0iYm9sZCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiPlM8L3RleHQ+PC9zdmc+" type="image/svg+xml">
  <style>
    :root{--ink:#17242D;--ink-2:#243741;--copper:#C0622D;--copper-dark:#A95025;--paper:#F7F5F1;--white:#FFFEFC;--line:#E7E2D9;--muted:#6D7A7F;--serif:Georgia,"Times New Roman",serif;--sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}html{min-height:100%;background:var(--paper)}body{min-height:100vh;margin:0;color:var(--ink);background:var(--paper);font-family:var(--sans);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
    .soon-card{width:min(100%,560px);padding:44px clamp(26px,5vw,52px);border:1px solid var(--line);border-radius:12px;background:var(--white);box-shadow:0 24px 60px rgba(23,36,45,.08);text-align:center}
    .badge{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;color:var(--copper);background:#F7E7DC;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .badge i{width:6px;height:6px;border-radius:50%;background:var(--copper)}
    h1{margin:22px 0 12px;font-size:clamp(30px,4vw,40px);line-height:1.05;letter-spacing:-.04em;font-weight:640}
    h1 em{color:var(--copper);font:italic 400 1em/1 var(--serif)}
    p{margin:0 auto;max-width:420px;color:var(--muted);font-size:13px;line-height:1.8}
    .soon-actions{margin-top:30px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 18px;border:1px solid transparent;border-radius:6px;font-size:12px;font-weight:750;text-decoration:none;transition:transform .15s,background .15s}
    .btn:hover{transform:translateY(-1px)}
    .btn-primary{color:#fff;background:var(--ink)}.btn-primary:hover{background:var(--ink-2)}
    .btn-muted{color:#58666B;border-color:var(--line);background:#fff}.btn-muted:hover{border-color:var(--copper);color:var(--copper)}
    .soon-foot{margin-top:26px;color:#9AA2A2;font-size:10px}
  </style>
</head>
<body>
  <main class="soon-card" role="main">
    <span class="badge"><i></i>Espace Marketing</span>
    <h1>Bientôt <em>disponible</em>.</h1>
    <p>Cet espace est en préparation. Il permettra de gérer les ventes et les commandes de l'équipe Americana directement depuis Sigma.</p>
    <div class="soon-actions">
      <a class="btn btn-primary" href="dashboard.html">← Revenir au tableau de bord</a>
      <a class="btn btn-muted" href="login.html">Changer d'espace</a>
    </div>
    <div class="soon-foot">Un produit ACX Maroc · <a href="mailto:sigma@acx.ma" style="color:inherit">Besoin d'aide ?</a></div>
  </main>
</body>
</html>
