<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sigma — Test Supabase</title>
<style>
body{font-family:system-ui,sans-serif;background:#F7F5F1;color:#17242D;margin:0;padding:32px}
.card{max-width:560px;margin:0 auto;background:#FFFEFC;border:1px solid #E7E2D9;border-radius:10px;padding:24px}
code{background:#F1EEE8;padding:2px 6px;border-radius:4px;font-size:12px}
#result{margin-top:16px;padding:12px;border-radius:6px;font-size:13px;white-space:pre-wrap}
.ok{background:#DCECE8;color:#376A64}.ko{background:#F7E4E1;color:#9E4D46}
button{min-height:40px;padding:0 18px;border:0;border-radius:5px;background:#C0622D;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Test Supabase — Americana</h1>
<p>1. Renseigne <code>js/supabase-config.js</code><br>2. Clique sur Tester.<br>3. Résultat attendu : nombre d'agents Americana.</p>
<button id="btn">Tester la connexion</button>
<div id="result">En attente…</div>
</div>
<script src="js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script>
document.getElementById('btn').addEventListener('click', async () => {
  const box = document.getElementById('result');
  box.className = ''; box.textContent = 'Connexion en cours…';
  try {
    const info = await window.sigmaSupabase.testConnection();
    box.className = 'ok';
    box.textContent = 'OK — agents Americana : ' + info.agents;
  } catch (e) {
    box.className = 'ko';
    box.textContent = 'ERREUR : ' + (e.message || e);
  }
});
</script>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</body>
</html>
